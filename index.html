<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNexus | Esports Analytics & Live Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --esc-green: #48F955;
            --esc-black: #050509;
            --esc-border: #1f2937;
        }

        body { 
            background-color: var(--esc-black); 
            color: #FFFFFF; 
            font-family: 'Inter', sans-serif; 
        }

        .esc-card { 
            background: #0b0d14;
            border: 1px solid var(--esc-border);
            border-radius: 4px;
        }

        .btn-primary {
            background-color: var(--esc-green);
            color: #000;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(72, 249, 85, 0.4);
        }

        .active-stream { 
            border-left: 4px solid var(--esc-green) !important;
            background: rgba(72, 249, 85, 0.05);
        }

        /* Live Chat Styling */
        .chat-container {
            height: 500px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--esc-border);
        }

        .data-label { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .live-dot {
            background-color: #ff4655;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body class="antialiased">

    <!-- Top Navigation -->
    <nav class="border-b border-gray-800 bg-[#050509] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-10">
                <h1 class="text-xl font-extrabold tracking-tight italic">
                    <span class="text-[var(--esc-green)]">GAME</span>NEXUS
                </h1>
                <div class="hidden md:flex space-x-6 text-xs font-bold text-gray-400 uppercase">
                    <a href="#" class="hover:text-white transition text-[var(--esc-green)]">Analytics</a>
                    <a href="#" class="hover:text-white transition">Tournaments</a>
                    <a href="#" class="hover:text-white transition">Teams</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="btn-primary text-[10px] px-4 py-2 rounded uppercase">Get Pro Access</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-8">
        
        <div class="mb-6">
            <div class="flex items-center space-x-2 text-[var(--esc-green)] text-[10px] font-black mb-2">
                <span class="w-2 h-2 rounded-full live-dot"></span>
                <span class="uppercase tracking-widest">Live: South Asia Play-Ins Day 3</span>
            </div>
            <h2 class="text-3xl font-extrabold uppercase">Esports Global Live</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Left: Video & Stats -->
            <div class="lg:col-span-3 space-y-4">
                <div class="esc-card overflow-hidden">
                    <div class="aspect-video bg-black">
                        <!-- Main Video Player -->
                        <iframe 
                            id="mainNexusPlayer"
                            width="100%" height="100%" 
                            src="https://www.youtube.com/embed/d8MFfmKP1oY?autoplay=1&mute=1" 
                            frameborder="0" allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- ESCharts Style Stats Row -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="esc-card p-4">
                        <p class="data-label">Broadcast Name</p>
                        <p class="text-lg font-bold text-white">FFMAI 2026 SPRING</p>
                    </div>
                    <div class="esc-card p-4">
                        <p class="data-label">Current Phase</p>
                        <p class="text-lg font-bold uppercase text-[var(--esc-green)]">Groups A - C</p>
                    </div>
                    <div class="esc-card p-4">
                        <button onclick="handleLike()" class="w-full text-left">
                            <p class="data-label">Viewer Appreciation</p>
                            <p class="text-lg font-bold"><i id="heartIcon" class="fa-solid fa-heart mr-2 text-gray-700"></i> <span id="likeCount">356</span></p>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Live Chat -->
            <div class="space-y-4">
                <div class="flex flex-col">
                    <div class="flex items-center justify-between mb-2">
                        <p class="data-label">Live Community Chat</p>
                        <span class="text-[9px] text-gray-500 uppercase font-bold">Auto-Syncing</span>
                    </div>
                    <div class="chat-container">
                        <!-- Integrated with your GitHub domain -->
                        <iframe 
                            id="liveChatEmbed"
                            width="100%" 
                            height="100%" 
                            src="https://www.youtube.com/live_chat?v=d8MFfmKP1oY&embed_domain=gamenexusofficial.github.io" 
                            frameborder="0">
                        </iframe>
                    </div>
                </div>

                <div class="esc-card p-4">
                    <p class="data-label mb-3">Live Now</p>
                    <div class="flex items-center space-x-3 active-stream p-2 border-l-4">
                        <div class="w-10 h-10 bg-gray-800 rounded bg-cover" style="background-image: url('https://img.youtube.com/vi/d8MFfmKP1oY/mqdefault.jpg')"></div>
                        <div class="overflow-hidden">
                            <p class="text-[10px] font-black uppercase truncate">Global Coverage</p>
                            <p class="text-[9px] text-gray-500 uppercase">Primary Stream</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let isLiked = false;
        function handleLike() {
            const countElement = document.getElementById('likeCount');
            const heartIcon = document.getElementById('heartIcon');
            let currentCount = parseInt(countElement.innerText);
            if (!isLiked) {
                countElement.innerText = currentCount + 1;
                heartIcon.style.color = "#ff4655";
                heartIcon.style.transform = "scale(1.1)";
                isLiked = true;
            } else {
                countElement.innerText = currentCount - 1;
                heartIcon.style.color = "#374151";
                heartIcon.style.transform = "scale(1)";
                isLiked = false;
            }
        }
    </script>
</body>
</html>
