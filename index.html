<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNexus | GitHub Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; }
        .live-card { border: 1px solid #1e293b; transition: 0.3s; cursor: pointer; background: #161b22; }
        .live-card:hover { border-color: #3b82f6; background: #1c2128; }
        .active-glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); border: 1px solid #3b82f6; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 2s infinite; }
    </style>
</head>
<body>

    <nav class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#0d1117]">
        <h1 class="text-xl font-bold text-blue-500 uppercase tracking-tighter">Game<span class="text-white">Nexus</span></h1>
        <div id="status" class="text-[10px] font-mono text-gray-500 uppercase">
            <span class="inline-block w-2 h-2 bg-yellow-500 rounded-full mr-1"></span> Connecting to API...
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- LEFT: MAIN PLAYER -->
            <div class="lg:col-span-2">
                <div class="relative aspect-video bg-black rounded-lg overflow-hidden border border-gray-800" id="mainContainer">
                    <div id="noLive" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
                        <i class="fa-solid fa-ghost text-4xl text-gray-800 mb-4"></i>
                        <h3 class="text-gray-500 font-bold uppercase tracking-widest text-sm">No Live Streams Found</h3>
                        <p class="text-gray-600 text-xs mt-2">The system is scanning your 5 tracked channels...</p>
                    </div>
                    <iframe id="nexusPlayer" class="hidden w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <div class="mt-4">
                    <h2 id="nowPlaying" class="text-lg font-bold text-gray-400 uppercase tracking-tight">Standby</h2>
                    <p id="nowGame" class="text-blue-500 text-[10px] font-black uppercase">Live Esports Monitor</p>
                </div>
            </div>

            <!-- RIGHT: LOBBY -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-2">Live Discovery</h3>
                <div id="lobby" class="space-y-3">
                    <!-- Cards will appear here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyB4uQ7xLebDtVuXijx4JMse7W-KBEgLbf4';
        
        // These are the exact IDs for the channels you provided
        const CHANNELS = [
            { id: 'UC08L_Yis-Wn8UveR9A8r6_A', name: 'Free Fire Global', game: 'Free Fire' },
            { id: 'UCy1Ms_5qBcPJ_v9lV79VW_A', name: 'LoL Esports', game: 'League of Legends' },
            { id: 'UCzS_G8E0_O_f8S953XGvG2Q', name: 'COD League', game: 'Call of Duty' },
            { id: 'UC8CX0LD98EDXl4UYX1AfDCg', name: 'Valorant Esports', game: 'Valorant' },
            { id: 'UCW0ZAn5E_V6pB1E6z8v0a_A', name: 'Free Fire Pakistan', game: 'Free Fire' }
        ];

        async function startNexus() {
            const status = document.getElementById('status');
            const lobby = document.getElementById('lobby');
            let hasLive = false;

            for (const ch of CHANNELS) {
                try {
                    // API Call to search for eventType=live
                    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${ch.id}&type=video&eventType=live&key=${API_KEY}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.items && data.items.length > 0) {
                        const video = data.items[0];
                        const videoId = video.id.videoId;
                        const title = video.snippet.title;

                        if (!hasLive) {
                            playVideo(videoId, title, ch.game);
                            hasLive = true;
                        }
                        createCard(videoId, title, ch.game);
                    }
                } catch (e) {
                    console.error("Error with channel: " + ch.name);
                }
            }

            if (hasLive) {
                status.innerHTML = '<span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1 animate-pulse"></span> NETWORK ACTIVE';
            } else {
                status.innerHTML = '<span class="inline-block w-2 h-2 bg-red-800 rounded-full mr-1"></span> CHANNELS OFFLINE';
            }
        }

        function playVideo(id, title, game) {
            const player = document.getElementById('nexusPlayer');
            const noLive = document.getElementById('noLive');
            const mainContainer = document.getElementById('mainContainer');
            
            noLive.classList.add('hidden');
            player.classList.remove('hidden');
            mainContainer.classList.add('active-glow');
            
            player.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`;
            document.getElementById('nowPlaying').innerText = title;
            document.getElementById('nowGame').innerText = game;
        }

        function createCard(id, title, game) {
            const lobby = document.getElementById('lobby');
            const card = document.createElement('div');
            card.className = "live-card p-3 rounded-md flex items-center gap-3";
            card.onclick = () => playVideo(id, title, game);
            
            card.innerHTML = `
                <div class="w-16 h-10 bg-gray-900 rounded bg-cover bg-center" style="background-image:url('https://img.youtube.com/vi/${id}/mqdefault.jpg')"></div>
                <div class="overflow-hidden">
                    <p class="text-[9px] font-bold text-blue-500 uppercase">${game}</p>
                    <p class="text-[10px] text-gray-300 truncate font-medium">${title}</p>
                </div>
            `;
            lobby.appendChild(card);
        }

        window.onload = startNexus;
    </script>
</body>
</html>
